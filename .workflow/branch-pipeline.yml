version: '1.0'
name: branch-pipeline
displayName: BranchPipeline
stages:
  - stage:
    name: compile
    displayName: 编译检查
    steps:
      - step: build@maven
        name: build_maven
        displayName: Maven 编译
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - mvn -B clean compile

triggers:
  push:
    branches:
      exclude:
        - master
      include:
        - .*