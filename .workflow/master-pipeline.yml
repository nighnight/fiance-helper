version: '1.0'
name: master-pipeline
displayName: MasterPipeline
stages:
  - stage:
    name: unit-test
    displayName: 代码级测试（质量门禁）
    steps:
      - step: build@maven
        name: build_and_test
        displayName: 编译并运行单元测试
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - mvn -B clean test jacoco:report
        artifacts:
          - name: TEST_REPORT
            path:
              - ./target/surefire-reports
              - ./target/site/jacoco
      - step: publish@general_artifacts
        name: publish_test_reports
        displayName: 上传测试报告
        dependArtifact: TEST_REPORT
        artifactName: test-reports
        dependsOn: build_and_test

  - stage:
    name: integration-test
    displayName: 客户侧回归测试
    steps:
      - step: build@maven
        name: package_app
        displayName: 打包应用
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - mvn -B package -DskipTests
        artifacts:
          - name: JAR_ARTIFACT
            path:
              - ./target/*.jar
      - step: shell@agent
        name: run_smoke_tests
        displayName: 启动应用并运行接口回归测试
        dependsOn: package_app
        inputs:
          script: |
            APP_JAR=$(ls target/*.jar | grep -v original | head -1)
            echo "Starting application: $APP_JAR"
            java -jar "$APP_JAR" --spring.profiles.active=test &
            APP_PID=$!
            sleep 30
            echo "Running API smoke tests..."
            bash scripts/api-smoke-test.sh
            TEST_RESULT=$?
            kill $APP_PID || true
            exit $TEST_RESULT

triggers:
  push:
    branches:
      include:
        - master
