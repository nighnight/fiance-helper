version: '1.0'
name: master-pipeline
displayName: MasterPipeline
stages:
  - stage:
    name: compile
    displayName: 编译
    steps:
      - step: shell@agent
        name: compile
        displayName: 编译项目
        inputs:
          script: |
            set -e
            echo "Downloading OpenJDK 17..."
            curl -fsSL -o /tmp/openjdk-17.tar.gz https://repo.huaweicloud.com/openjdk/17/openjdk-17_linux-x64_bin.tar.gz
            mkdir -p /tmp/openjdk-17 && tar -xzf /tmp/openjdk-17.tar.gz -C /tmp/openjdk-17 --strip-components=1
            export JAVA_HOME=/tmp/openjdk-17
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            mvn -B compile

  - stage:
    name: unit-test
    displayName: 代码级测试（质量门禁）
    steps:
      - step: shell@agent
        name: build_and_test
        displayName: 编译测试并生成覆盖率报告
        inputs:
          script: |
            set -e
            echo "Downloading OpenJDK 17..."
            curl -fsSL -o /tmp/openjdk-17.tar.gz https://repo.huaweicloud.com/openjdk/17/openjdk-17_linux-x64_bin.tar.gz
            mkdir -p /tmp/openjdk-17 && tar -xzf /tmp/openjdk-17.tar.gz -C /tmp/openjdk-17 --strip-components=1
            export JAVA_HOME=/tmp/openjdk-17
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            mvn -B clean test jacoco:report
        artifacts:
          - name: TEST_REPORT
            path:
              - ./target/surefire-reports
              - ./target/site/jacoco
      - step: publish@general_artifacts
        name: publish_test_reports
        displayName: 上传测试报告
        dependArtifact: TEST_REPORT
        artifactName: test-reports
        dependsOn: build_and_test

  - stage:
    name: integration-test
    displayName: 客户侧回归测试（API/CLI）
    steps:
      - step: shell@agent
        name: package_app
        displayName: 打包可运行 JAR
        inputs:
          script: |
            set -e
            echo "Downloading OpenJDK 17..."
            curl -fsSL -o /tmp/openjdk-17.tar.gz https://repo.huaweicloud.com/openjdk/17/openjdk-17_linux-x64_bin.tar.gz
            mkdir -p /tmp/openjdk-17 && tar -xzf /tmp/openjdk-17.tar.gz -C /tmp/openjdk-17 --strip-components=1
            export JAVA_HOME=/tmp/openjdk-17
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            mvn -B package -DskipTests
        artifacts:
          - name: JAR_ARTIFACT
            path:
              - ./target/*.jar
      - step: shell@agent
        name: run_smoke_tests
        displayName: 启动应用并运行 CLI 回归测试
        dependsOn: package_app
        dependArtifact: JAR_ARTIFACT
        inputs:
          script: |
            set -e
            echo "Downloading OpenJDK 17..."
            curl -fsSL -o /tmp/openjdk-17.tar.gz https://repo.huaweicloud.com/openjdk/17/openjdk-17_linux-x64_bin.tar.gz
            mkdir -p /tmp/openjdk-17 && tar -xzf /tmp/openjdk-17.tar.gz -C /tmp/openjdk-17 --strip-components=1
            export JAVA_HOME=/tmp/openjdk-17
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            APP_JAR=$(ls target/*.jar | grep -v original | head -1)
            echo "Starting application: $APP_JAR"
            nohup java -jar "$APP_JAR" --spring.profiles.active=test > app.log 2>&1 &
            APP_PID=$!
            echo "Waiting for app startup..."
            sleep 30
            echo "Running API smoke tests..."
            bash scripts/api-smoke-test.sh
            TEST_RESULT=$?
            echo "Killing application (PID: $APP_PID)"
            kill $APP_PID || true
            exit $TEST_RESULT

triggers:
  push:
    branches:
      include:
        - master
