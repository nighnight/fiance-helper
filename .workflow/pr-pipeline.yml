version: '1.0'
name: pr-pipeline
displayName: PRPipeline
stages:
  - stage:
    name: unit-test
    displayName: 代码级测试（PR 门禁）
    steps:
      - step: build@maven
        name: build_and_test
        displayName: 编译并运行单元测试
        inputs:
          jdkVersion: 11
          mavenVersion: 3.6.3
        commands:
          - apt-get update && apt-get install -y openjdk-17-jdk ca-certificates-java
          - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          - export PATH=$JAVA_HOME/bin:$PATH
          - java -version
          - mvn -B clean test jacoco:report
        artifacts:
          - name: TEST_REPORT
            path:
              - ./target/surefire-reports
              - ./target/site/jacoco
      - step: publish@general_artifacts
        name: publish_test_reports
        displayName: 上传测试报告
        dependArtifact: TEST_REPORT
        artifactName: test-reports
        dependsOn: build_and_test

triggers:
  pullRequest:
    branches:
      include:
        - master
