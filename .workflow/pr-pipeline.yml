version: '1.0'
name: pr-pipeline
displayName: PRPipeline
stages:
  - stage:
    name: unit-test
    displayName: 代码级测试（PR 门禁）
    steps:
      - step: shell@agent
        name: build_and_test
        displayName: 编译并运行单元测试
        inputs:
          script: |
            set -e
            echo "Downloading OpenJDK 17..."
            curl -fsSL -o /tmp/openjdk-17.tar.gz https://repo.huaweicloud.com/openjdk/17/openjdk-17_linux-x64_bin.tar.gz
            mkdir -p /tmp/openjdk-17 && tar -xzf /tmp/openjdk-17.tar.gz -C /tmp/openjdk-17 --strip-components=1
            export JAVA_HOME=/tmp/openjdk-17
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            mvn -B clean test jacoco:report
        artifacts:
          - name: TEST_REPORT
            path:
              - ./target/surefire-reports
              - ./target/site/jacoco
      - step: publish@general_artifacts
        name: publish_test_reports
        displayName: 上传测试报告
        dependArtifact: TEST_REPORT
        artifactName: test-reports
        dependsOn: build_and_test

triggers:
  pullRequest:
    branches:
      include:
        - master
