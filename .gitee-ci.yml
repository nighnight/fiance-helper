stages:
  - compile
  - unit-test
  - integration-test

compile_job:
  stage: compile
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B compile

unit_test_job:
  stage: unit-test
  image: maven:3.9-eclipse-temurin-17
  script:
    - java -version
    - mvn -B clean test jacoco:report
  artifacts:
    paths:
      - target/surefire-reports
      - target/site/jacoco

integration_test_job:
  stage: integration-test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B package -DskipTests
    - APP_JAR=$(ls target/*.jar | grep -v original | head -1)
    - echo "Starting application: $APP_JAR"
    - nohup java -jar "$APP_JAR" --spring.profiles.active=test > app.log 2>&1 &
    - sleep 30
    - echo "Running API smoke tests..."
    - bash scripts/api-smoke-test.sh
