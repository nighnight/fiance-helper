name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B clean test jacoco:report
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          target/surefire-reports
          target/site/jacoco

  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Package Application
      run: mvn -B package -DskipTests
    - name: Run Smoke Tests
      run: |
        APP_JAR=$(ls target/*.jar | grep -v original | head -1)
        echo "Starting application: $APP_JAR"
        nohup java -jar "$APP_JAR" --spring.profiles.active=test > app.log 2>&1 &
        sleep 30
        bash scripts/api-smoke-test.sh
