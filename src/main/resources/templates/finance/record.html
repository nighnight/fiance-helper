<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收支记录 - 财务助手</title>
  <!-- 替换为你本地的Bootstrap样式文件 -->
  <link href="/lib/css/bootstrap.min.css" rel="stylesheet">
  <!-- 替换为你本地的jQuery文件 -->
  <script src="/lib/js/jquery-3.5.1.min.js"></script>
  <!-- 替换为你本地的Bootstrap JS文件 -->
  <script src="/lib/js/bootstrap.bundle.min.js"></script>
  <style>
    /* 自定义样式（保持不变） */
    body {
      background-color: #f8f9fa;
      padding-top: 20px;
    }
    .container {
      max-width: 1200px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }
    .stats-card {
      background: linear-gradient(135deg, #e8f4f8 0%, #f0f8fb 100%);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .income-text {
      color: #28a745;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .expense-text {
      color: #dc3545;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .form-card {
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .table-responsive {
      margin-top: 20px;
    }
    .empty-record {
      text-align: center;
      padding: 40px;
      color: #6c757d;
      font-size: 1.1rem;
    }
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      .stats-card .col-md-6 {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
<!-- 页面内容（保持不变） -->
<div class="container">
  <!-- 页面标题 -->
  <div class="mb-4">
    <h2 class="text-primary">📊 我的收支记录</h2>
    <hr>
  </div>

  <!-- 收支统计卡片 -->
  <div class="stats-card">
    <div class="row">
      <div class="col-md-6">
        <h5 class="text-muted">总收入</h5>
        <p class="income-text" th:text="'¥' + ${totalIncome}">¥0.00</p>
      </div>
      <div class="col-md-6">
        <h5 class="text-muted">总支出</h5>
        <p class="expense-text" th:text="'¥' + ${totalExpense}">¥0.00</p>
      </div>
    </div>
  </div>

  <!-- 新增记录表单 -->
  <div class="form-card">
    <h5 class="mb-3">✏️ 新增收支记录</h5>
    <form th:action="@{/api/v1/finance/addRecord}" method="post" id="addRecordForm">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">收支类型 <span class="text-danger">*</span></label>
          <select name="type" class="form-select" required>
            <option value="1">收入</option>
            <option value="2">支出</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">分类 <span class="text-danger">*</span></label>
          <select name="categoryId" class="form-select" required>
            <optgroup label="收入分类" th:each="cat : ${incomeCats}">
              <option th:value="${cat.id}" th:text="${cat.name}">工资</option>
            </optgroup>
            <optgroup label="支出分类" th:each="cat : ${expenseCats}">
              <option th:value="${cat.id}" th:text="${cat.name}">餐饮</option>
            </optgroup>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">金额（元）<span class="text-danger">*</span></label>
          <input type="number" step="0.01" min="0.01" name="amount" class="form-control" placeholder="0.00" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">记录时间</label>
          <input type="datetime-local" name="recordTime" class="form-control"
                 th:value="${#temporals.format(java.time.LocalDateTime.now(), 'yyyy-MM-dd') + 'T' + #temporals.format(java.time.LocalDateTime.now(), 'HH:mm')}">
        </div>
        <div class="col-md-2">
          <label class="form-label">备注</label>
          <input type="text" name="remark" class="form-control" placeholder="可选">
        </div>
        <div class="col-md-1 align-self-end">
          <button type="submit" class="btn btn-primary w-100">提交</button>
        </div>
      </div>
    </form>
  </div>

  <!-- 筛选表单 -->
  <div class="form-card">
    <h5 class="mb-3">🔍 筛选记录</h5>
    <form th:action="@{/api/v1/finance/filter}" method="get" id="filterForm">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">收支类型 <span class="text-danger">*</span></label>
          <select name="type" class="form-select" required>
            <option value="1">收入</option>
            <option value="2">支出</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">开始时间</label>
          <input type="datetime-local" name="startTime" class="form-control" placeholder="选择开始时间">
        </div>
        <div class="col-md-4">
          <label class="form-label">结束时间</label>
          <input type="datetime-local" name="endTime" class="form-control" placeholder="选择结束时间">
        </div>
        <div class="col-md-2 align-self-end">
          <button type="submit" class="btn btn-outline-primary w-100">筛选</button>
        </div>
      </div>
    </form>
  </div>

  <!-- 记录列表 -->
  <div class="table-responsive">
    <table class="table table-hover table-striped">
      <thead class="table-light">
      <tr>
        <<th width="10%">类型</</th>
        <<th width="15%">分类</</th>
        <<th width="15%">金额</</th>
        <<th width="25%">记录时间</</th>
        <<th width="35%">备注</</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="record : ${recordList}">
        <td>
                            <span th:class="${record.type == 1 ? 'badge bg-success' : 'badge bg-danger'}"
                                  th:text="${record.type == 1 ? '收入' : '支出'}">收入</span>
        </td>
        <td th:text="${record.categoryName}">工资</td>
        <td>
                            <span th:class="${record.type == 1 ? 'text-success' : 'text-danger'}"
                                  th:text="'¥' + ${record.amount}">¥1000.00</span>
        </td>
        <td th:text="${#temporals.format(record.recordTime, 'yyyy-MM-dd HH:mm:ss')}">2025-12-07 10:00:00</td>
        <td th:text="${record.remark} ?: '-'">-</td>
      </tr>
      <tr th:if="${#lists.isEmpty(recordList)}">
        <td colspan="5" class="empty-record">
          <<i class="bi bi-inbox"></</i> 暂无收支记录，快去添加吧！
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 表单验证脚本（保持不变） -->
<script>
  $('#addRecordForm').submit(function(e) {
    const amount = $(this).find('input[name="amount"]').val();
    if (amount <= 0) {
      alert('金额必须大于0！');
      e.preventDefault();
      return false;
    }
  });

  $('#filterForm').submit(function(e) {
    const startTime = $(this).find('input[name="startTime"]').val();
    const endTime = $(this).find('input[name="endTime"]').val();
    if (startTime && endTime && new Date(startTime) > new Date(endTime)) {
      alert('开始时间不能晚于结束时间！');
      e.preventDefault();
      return false;
    }
  });
</script>
</body>
</html>
