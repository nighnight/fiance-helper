<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首页 - 财务助手</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .stat-card { transition: all 0.3s; border: none; border-radius: 12px; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .module-card { cursor: pointer; height: 100%; transition: all 0.2s; }
        .module-card:hover { border-color: #0d6efd; background-color: #f8faff; }
        .icon-box { font-size: 2rem; margin-bottom: 10px; }
        .disabled-module { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- 1. 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-wallet2"></i> 财务助手
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/">仪表盘</a></li>
                <li class="nav-item"><a class="nav-link" href="/account/index">账户管理</a></li>
                <!-- 预留导航 -->
                <li class="nav-item"><a class="nav-link disabled" href="#">收支记录</a></li>
                <li class="nav-item"><a class="nav-link disabled" href="#">统计报表</a></li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <div class="dropdown">
                    <a class="text-white text-decoration-none dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span th:text="${user.nickname}">用户</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear"></i> 个人设置</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/user/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- 2. 主内容区域 -->
<div class="container mt-4">

    <!-- 第一行：数据概览卡片 -->
    <div class="row g-4 mb-4">
        <!-- 总资产 (动态计算) -->
        <div class="col-md-4">
            <div class="card stat-card bg-primary text-white h-100">
                <div class="card-body">
                    <h6 class="card-title opacity-75">总资产</h6>
                    <h2 class="fw-bold my-2" id="totalAssets">¥ 0.00</h2>
                    <small class="opacity-75"><i class="bi bi-graph-up-arrow"></i> 实时统计</small>
                </div>
            </div>
        </div>
        <!-- 本月收入 (预留) -->
        <div class="col-md-4">
            <div class="card stat-card bg-success text-white h-100">
                <div class="card-body">
                    <h6 class="card-title opacity-75">本月收入 (预留)</h6>
                    <h2 class="fw-bold my-2">¥ 0.00</h2>
                    <small class="opacity-75">待开发收支模块</small>
                </div>
            </div>
        </div>
        <!-- 本月支出 (预留) -->
        <div class="col-md-4">
            <div class="card stat-card bg-danger text-white h-100">
                <div class="card-body">
                    <h6 class="card-title opacity-75">本月支出 (预留)</h6>
                    <h2 class="fw-bold my-2">¥ 0.00</h2>
                    <small class="opacity-75">待开发收支模块</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 左侧：功能入口 -->
        <div class="col-lg-8">
            <h5 class="mb-3 text-secondary">常用功能</h5>
            <div class="row g-3">

                <!-- 模块 1: 账户管理 (已完成) -->
                <div class="col-md-6">
                    <div class="card module-card shadow-sm p-3" onclick="location.href='/account/index'">
                        <div class="d-flex align-items-center">
                            <div class="icon-box text-primary me-3">
                                <i class="bi bi-credit-card-2-front"></i>
                            </div>
                            <div>
                                <h5 class="mb-1">账户管理</h5>
                                <p class="text-muted small mb-0">管理银行卡、支付宝、微信等资金账户</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模块 2: 记一笔 (待开发) -->
                <div class="col-md-6">
                    <div class="card module-card shadow-sm p-3 disabled-module" onclick="alert('该功能将在【收支记录】模块中开发')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box text-success me-3">
                                <i class="bi bi-pencil-square"></i>
                            </div>
                            <div>
                                <h5 class="mb-1">记一笔 (开发中)</h5>
                                <p class="text-muted small mb-0">快速记录日常收入与支出</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模块 3: 统计报表 (待开发) -->
                <div class="col-md-6">
                    <div class="card module-card shadow-sm p-3 disabled-module" onclick="alert('该功能将在【图表分析】模块中开发')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box text-warning me-3">
                                <i class="bi bi-pie-chart"></i>
                            </div>
                            <div>
                                <h5 class="mb-1">统计分析 (开发中)</h5>
                                <p class="text-muted small mb-0">查看收支趋势图与分类占比</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模块 4: 预算设置 (待开发) -->
                <div class="col-md-6">
                    <div class="card module-card shadow-sm p-3 disabled-module" onclick="alert('该功能将在【预算管理】模块中开发')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box text-info me-3">
                                <i class="bi bi-speedometer2"></i>
                            </div>
                            <div>
                                <h5 class="mb-1">预算管理 (开发中)</h5>
                                <p class="text-muted small mb-0">设置月度预算，防止超支</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：我的账户预览 -->
        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h6 class="mb-0">我的账户</h6>
                    <a href="/account/index" class="text-decoration-none small">全部 ></a>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="accountPreviewList">
                        <!-- 动态加载账户列表 -->
                        <li class="list-group-item text-center py-4 text-muted">加载中...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入 Bootstrap JS 和 jQuery -->
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>
    $(document).ready(function() {
        // 页面加载完成后，调用后端接口获取数据
        fetchDashboardData();
    });

    function fetchDashboardData() {
        // 利用已有的 /account/list 接口来计算总资产和展示预览
        $.ajax({
            url: '/account/list',
            type: 'GET',
            success: function(res) {
                if (res.code === 200) {
                    renderAccountData(res.data);
                } else {
                    console.error("加载数据失败: " + res.msg);
                }
            }
        });
    }

    function renderAccountData(accounts) {
        let total = 0;
        let html = '';

        if (!accounts || accounts.length === 0) {
            html = '<li class="list-group-item text-center py-4 text-muted">暂无账户</li>';
        } else {
            // 1. 计算总资产
            accounts.forEach(acc => {
                total += parseFloat(acc.currentBalance);
            });

            // 2. 生成右侧预览列表 (只显示前 5 个)
            $.each(accounts.slice(0, 5), function(index, item) {
                let icon = 'bi-credit-card';
                if(item.accountType === '微信') icon = 'bi-chat-dots text-success';
                if(item.accountType === '支付宝') icon = 'bi-alipay text-primary';
                if(item.accountType === '现金') icon = 'bi-cash-coin text-warning';

                html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi ${icon} me-2"></i>
                            <span>${item.accountName}</span>
                        </div>
                        <span class="fw-bold">¥ ${item.currentBalance}</span>
                    </li>
                `;
            });
        }

        // 更新页面 DOM
        $('#totalAssets').text('¥ ' + total.toFixed(2));
        $('#accountPreviewList').html(html);
    }
</script>

</body>
</html>
