<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增账户</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0">新增账户</h5>
        </div>
        <div class="card-body">
            <form id="addForm">
                <div class="mb-3">
                    <label class="form-label">账户名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="accountName" placeholder="例如：招商工资卡" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">账户类型</label>
                    <select class="form-select" name="accountType">
                        <option value="微信">微信</option>
                        <option value="支付宝">支付宝</option>
                        <option value="银行卡">银行卡</option>
                        <option value="现金">现金</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">初始余额</label>
                    <input type="number" class="form-control" name="initialBalance" value="0" step="0.01">
                </div>

                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" name="remark" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/account/index" class="btn btn-light me-md-2">取消</a>
                    <button type="button" class="btn btn-primary" onclick="submitAdd()">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    function submitAdd() {
        var data = {
            accountName: $('input[name="accountName"]').val(),
            accountType: $('select[name="accountType"]').val(),
            initialBalance: $('input[name="initialBalance"]').val(),
            remark: $('textarea[name="remark"]').val()
        };

        if(!data.accountName) {
            alert("请填写账户名称");
            return;
        }

        $.ajax({
            url: '/account', // POST
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    window.location.href = '/account/index';
                } else {
                    alert("操作失败：" + res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
