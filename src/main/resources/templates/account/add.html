<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加账户</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">添加新账户</h2>

    <div class="form-card">
        <form id="addAccountForm" th:object="${accountDTO}">
            <div class="form-group">
                <label for="accountName">账户名称</label>
                <input type="text" class="form-control" id="accountName" th:field="*{accountName}" placeholder="如：工资卡、支付宝" required>
            </div>
            <div class="form-group">
                <label for="accountType">账户类型</label>
                <select class="form-control" id="accountType" th:field="*{accountType}" required>
                    <option value="">请选择账户类型</option>
                    <option value="银行卡">银行卡</option>
                    <option value="支付宝">支付宝</option>
                    <option value="微信支付">微信支付</option>
                    <option value="现金">现金</option>
                    <option value="信用卡">信用卡</option>
                    <option value="投资账户">投资账户</option>
                    <!-- 可以添加更多类型 -->
                </select>
            </div>
            <div class="form-group">
                <label for="initialBalance">初始余额</label>
                <input type="number" step="0.01" class="form-control" id="initialBalance" th:field="*{initialBalance}" value="0.00" required>
            </div>
            <div class="form-group">
                <label for="remark">备注 (可选)</label>
                <textarea class="form-control" id="remark" th:field="*{remark}" rows="3"></textarea>
            </div>
            <div class="form-group text-center mt-4">
                <button type="submit" class="btn btn-primary">添加账户</button>
                <a th:href="@{/account/list}" class="btn btn-secondary ml-3">取消</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        $('#addAccountForm').submit(function(e) {
            e.preventDefault();
            let accountData = {
                accountName: $('#accountName').val(),
                accountType: $('#accountType').val(),
                initialBalance: parseFloat($('#initialBalance').val()),
                remark: $('#remark').val()
            };

            sendAjaxRequest('/account/api/add', 'POST', accountData, function() {
                showMessage('账户添加成功！', 'success');
                window.location.href = '/account/list'; // 添加成功后跳转回列表
            });
        });
    });
</script>
</body>
</html>
