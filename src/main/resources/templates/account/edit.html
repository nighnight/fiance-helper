<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑账户</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0">编辑账户</h5>
        </div>
        <div class="card-body">
            <form id="editForm">
                <input type="hidden" id="accountId">

                <div class="mb-3">
                    <label class="form-label">账户名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="accountName" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">账户类型</label>
                    <select class="form-select" id="accountType">
                        <option value="微信">微信</option>
                        <option value="支付宝">支付宝</option>
                        <option value="银行卡">银行卡</option>
                        <option value="现金">现金</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">当前余额</label>
                    <input type="text" class="form-control bg-light" id="currentBalance" readonly>
                    <div class="form-text">余额请通过收支记录进行变动</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="remark" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/account/index" class="btn btn-light me-md-2">取消</a>
                    <button type="button" class="btn btn-primary" onclick="submitEdit()">保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        const id = new URLSearchParams(window.location.search).get('id');
        if(id) {
            loadInfo(id);
        } else {
            alert("参数错误");
            window.location.href = '/account/index';
        }
    });

    function loadInfo(id) {
        $.ajax({
            url: '/account/' + id,
            type: 'GET',
            success: function(res) {
                if(res.code === 200) {
                    var acc = res.data;
                    $('#accountId').val(acc.id);
                    $('#accountName').val(acc.accountName);
                    $('#accountType').val(acc.accountType);
                    $('#currentBalance').val(acc.currentBalance);
                    $('#remark').val(acc.remark);
                } else {
                    alert("加载失败");
                }
            }
        });
    }

    function submitEdit() {
        var data = {
            id: $('#accountId').val(),
            accountName: $('#accountName').val(),
            accountType: $('#accountType').val(),
            remark: $('#remark').val()
        };

        if(!data.accountName) {
            alert("请填写账户名称");
            return;
        }

        $.ajax({
            url: '/account', // PUT
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    alert("修改成功");
                    window.location.href = '/account/index';
                } else {
                    alert(res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
