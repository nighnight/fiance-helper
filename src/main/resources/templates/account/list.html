<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户管理</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">账户管理</h2>

    <div class="alert alert-info" role="alert">
        当前总资产: <strong th:text="${'¥ ' + (#numbers.formatDecimal(totalAssets, 0, 'COMMA', 2, 'POINT'))}">¥ 0.00</strong>
    </div>

    <div class="mb-3 text-right">
        <a th:href="@{/account/add}" class="btn btn-primary">添加新账户</a>
    </div>

    <div class="data-table">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>账户名称</th>
                <th>账户类型</th>
                <th>当前余额</th>
                <th>备注</th>
                <th>最后更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="accountTableBody">
            <tr th:each="account : ${accounts}" th:data-id="${account.id}">
                <td th:text="${account.accountName}">支付宝</td>
                <td th:text="${account.accountType}">支付宝</td>
                <td><span th:text="${'¥ ' + (#numbers.formatDecimal(account.currentBalance, 0, 'COMMA', 2, 'POINT'))}">¥ 0.00</span></td>
                <td th:text="${account.remark}">日常消费账户</td>
                <td th:text="${#temporals.format(account.updateTime, 'yyyy-MM-dd HH:mm:ss')}">2024-03-01 10:30:00</td>
                <td class="action-buttons">
                    <a th:href="@{'/account/edit/' + ${account.id}}" class="btn btn-sm btn-warning">编辑</a>
                    <button class="btn btn-sm btn-danger delete-btn" th:data-id="${account.id}">删除</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(accounts)}">
                <td colspan="6" class="text-center">暂无账户信息</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        // 绑定删除按钮事件
        $('#accountTableBody').on('click', '.delete-btn', function() {
            let accountId = $(this).data('id');
            confirmAction('确定要删除这个账户吗？删除账户将影响所有关联的收支记录，操作不可逆！', function() {
                sendAjaxRequest('/account/api/delete/' + accountId, 'DELETE', null, function() {
                    showMessage('账户删除成功！', 'success');
                    window.location.reload(); // 删除成功后刷新页面
                });
            });
        });
    });
</script>
</body>
</html>
