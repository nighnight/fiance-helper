<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的账户</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">财务助手</a>
        <span class="navbar-text text-white">账户管理</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>账户列表</h3>
        <a href="/account/toAdd" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> 新增账户
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>账户名称</th>
                    <th>类型</th>
                    <th>当前余额</th>
                    <th>备注</th>
                    <th style="width: 150px;">操作</th>
                </tr>
                </thead>
                <tbody id="accountTableBody">
                <!-- 数据动态加载 -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3 text-center">
        <a href="/" class="btn btn-link text-decoration-none">返回首页</a>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        loadData();
    });

    function loadData() {
        $.ajax({
            url: '/account/list',
            type: 'GET',
            success: function(res) {
                if (res.code === 200) {
                    renderTable(res.data);
                } else {
                    alert("加载失败：" + res.msg);
                }
            }
        });
    }

    function renderTable(list) {
        var html = '';
        if (!list || list.length === 0) {
            html = '<tr><td colspan="5" class="text-center text-muted py-4">暂无账户，快去添加一个吧！</td></tr>';
        } else {
            $.each(list, function(index, item) {
                var badgeClass = 'bg-secondary';
                if(item.accountType === '微信') badgeClass = 'bg-success';
                if(item.accountType === '支付宝') badgeClass = 'bg-primary';
                if(item.accountType === '银行卡') badgeClass = 'bg-warning text-dark';

                html += '<tr>' +
                    '<td class="align-middle fw-medium">' + item.accountName + '</td>' +
                    '<td class="align-middle"><span class="badge ' + badgeClass + '">' + item.accountType + '</span></td>' +
                    '<td class="align-middle text-danger fw-bold">¥ ' + item.currentBalance + '</td>' +
                    '<td class="align-middle text-muted">' + (item.remark || '-') + '</td>' +
                    '<td class="align-middle">' +
                    '<button class="btn btn-sm btn-outline-primary me-2" onclick="toEdit(' + item.id + ')"><i class="bi bi-pencil"></i></button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteAccount(' + item.id + ')"><i class="bi bi-trash"></i></button>' +
                    '</td>' +
                    '</tr>';
            });
        }
        $('#accountTableBody').html(html);
    }

    function toEdit(id) {
        window.location.href = '/account/toEdit?id=' + id;
    }

    function deleteAccount(id) {
        if(!confirm("确定要删除该账户吗？此操作不可恢复。")) return;
        $.ajax({
            url: '/account/' + id,
            type: 'DELETE',
            success: function(res) {
                if(res.code === 200) {
                    loadData(); // 刷新表格
                } else {
                    alert(res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
