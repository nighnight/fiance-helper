<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务分析</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">财务分析</h2>

    <!-- 关键财务指标 (直接复用首页的KeyIndexVO) -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">当前财务概览</h5>
            <div class="form-row align-items-end mb-3">
                <div class="form-group col-md-3">
                    <label for="keyIndexDate">查询日期 (当月)</label>
                    <input type="date" class="form-control" id="keyIndexDate" th:value="${currentMonth + '-01'}">
                </div>
                <div class="form-group col-md-auto">
                    <button type="button" class="btn btn-info" id="loadKeyIndexButton">查询概览</button>
                </div>
            </div>
            <div class="row text-center">
                <div class="col-md-3 mb-2">
                    <div class="key-index-card income p-2">
                        <h6>当月总收入</h6>
                        <p id="totalIncomeMonth" class="m-0">¥ 0.00</p>
                    </div>
                </div>
                <div class="col-md-3 mb-2">
                    <div class="key-index-card expense p-2">
                        <h6>当月总支出</h6>
                        <p id="totalExpenseMonth" class="m-0">¥ 0.00</p>
                    </div>
                </div>
                <div class="col-md-3 mb-2">
                    <div class="key-index-card p-2">
                        <h6>当月结余</h6>
                        <p id="monthBalance" class="m-0">¥ 0.00</p>
                    </div>
                </div>
                <div class="col-md-3 mb-2">
                    <div class="key-index-card p-2">
                        <h6>总资产</h6>
                        <p id="totalAsset" class="m-0">¥ 0.00</p>
                    </div>
                </div>
                <!-- 净资产可以根据实际情况显示 -->
                <!-- <div class="col-md-2">
                    <div class="key-index-card p-2">
                        <h6>净资产</h6>
                        <p id="netAsset" class="m-0">¥ 0.00</p>
                    </div>
                </div> -->
            </div>
        </div>
    </div>

    <!-- 图表筛选区域 -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">图表数据筛选</h5>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="chartDateRangeStart">开始日期</label>
                    <input type="date" class="form-control" id="chartDateRangeStart" value="2024-01-01">
                </div>
                <div class="form-group col-md-4">
                    <label for="chartDateRangeEnd">结束日期</label>
                    <input type="date" class="form-control" id="chartDateRangeEnd" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                </div>
                <div class="form-group col-md-4 align-self-end text-right">
                    <button type="button" class="btn btn-primary" id="loadChartsButton">生成图表</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 图表展示区域 -->
    <div class="row">
        <div class="col-md-12">
            <div class="chart-container" id="monthlyTrendChart"></div>
        </div>
        <div class="col-md-6">
            <div class="chart-container" id="expensePieChart"></div>
        </div>
        <div class="col-md-6">
            <div class="chart-container" id="incomePieChart"></div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/lib/echarts.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script th:src="@{/static/js/chart.js}"></script>
</body>
</html>
