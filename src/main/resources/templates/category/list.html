<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类别管理</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">类别管理</h2>

    <div class="mb-3 text-right">
        <a th:href="@{/category/add}" class="btn btn-primary">添加新类别</a>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="data-table">
                <h4>收入类别</h4>
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>名称</th>
                        <th>排序</th>
                        <th>是否系统默认</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="incomeCategoryTableBody">
                    <tr th:each="category : ${incomeCategories}" th:data-id="${category.id}">
                        <td th:text="${category.categoryName}">工资</td>
                        <td th:text="${category.sort}">0</td>
                        <td><span th:if="${category.isDefault == 1}" class="badge badge-success">是</span><span th:if="${category.isDefault == 0}" class="badge badge-secondary">否</span></td>
                        <td class="action-buttons">
                            <a th:if="${category.isDefault == 0}" th:href="@{'/category/edit/' + ${category.id}}" class="btn btn-sm btn-warning">编辑</a>
                            <button th:if="${category.isDefault == 0}" class="btn btn-sm btn-danger delete-btn" th:data-id="${category.id}">删除</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(incomeCategories)}">
                        <td colspan="4" class="text-center">暂无收入类别</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="data-table">
                <h4>支出类别</h4>
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>名称</th>
                        <th>排序</th>
                        <th>是否系统默认</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="expenseCategoryTableBody">
                    <tr th:each="category : ${expenseCategories}" th:data-id="${category.id}">
                        <td th:text="${category.categoryName}">餐饮</td>
                        <td th:text="${category.sort}">0</td>
                        <td><span th:if="${category.isDefault == 1}" class="badge badge-success">是</span><span th:if="${category.isDefault == 0}" class="badge badge-secondary">否</span></td>
                        <td class="action-buttons">
                            <a th:if="${category.isDefault == 0}" th:href="@{'/category/edit/' + ${category.id}}" class="btn btn-sm btn-warning">编辑</a>
                            <button th:if="${category.isDefault == 0}" class="btn btn-sm btn-danger delete-btn" th:data-id="${category.id}">删除</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expenseCategories)}">
                        <td colspan="4" class="text-center">暂无支出类别</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        // 绑定删除按钮事件
        $('.data-table').on('click', '.delete-btn', function() {
            let categoryId = $(this).data('id');
            confirmAction('确定要删除这个类别吗？', function() {
                sendAjaxRequest('/category/api/delete/' + categoryId, 'DELETE', null, function() {
                    showMessage('类别删除成功！', 'success');
                    window.location.reload(); // 删除成功后刷新页面
                });
            });
        });
    });
</script>
</body>
</html>
