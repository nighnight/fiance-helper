<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑类别</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">编辑类别</h2>

    <div class="form-card">
        <form id="editCategoryForm" th:object="${categoryDTO}">
            <input type="hidden" id="categoryId" th:value="${categoryId}">
            <div class="form-group">
                <label>类别类型</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="typeIncome" name="type" th:field="*{type}" value="1" disabled>
                        <label class="form-check-label" for="typeIncome">收入</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="typeExpense" name="type" th:field="*{type}" value="2" disabled>
                        <label class="form-check-label" for="typeExpense">支出</label>
                    </div>
                </div>
                <small class="form-text text-muted">类别类型创建后不可修改。</small>
            </div>
            <div class="form-group mt-3">
                <label for="categoryName">类别名称</label>
                <input type="text" class="form-control" id="categoryName" th:field="*{categoryName}" required>
            </div>
            <div class="form-group">
                <label for="sort">排序 (数字越小越靠前)</label>
                <input type="number" class="form-control" id="sort" th:field="*{sort}">
            </div>
            <div class="form-group text-center mt-4">
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a th:href="@{/category/list}" class="btn btn-secondary ml-3">取消</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        var categoryId = $('#categoryId').val();
        $('#editCategoryForm').submit(function(e) {
            e.preventDefault();
            let categoryData = {
                id: categoryId,
                categoryName: $('#categoryName').val(),
                // type: parseInt($('input[name="type"]:checked').val()), // type不可修改，后端会忽略
                sort: parseInt($('#sort').val())
            };

            sendAjaxRequest('/category/api/update/' + categoryId, 'POST', categoryData, function() {
                showMessage('类别更新成功！', 'success');
                window.location.href = '/category/list'; // 更新成功后跳转回列表
            });
        });
    });
</script>
</body>
</html>
