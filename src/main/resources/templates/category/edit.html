<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑分类</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0">编辑分类</h5>
        </div>
        <div class="card-body">
            <form id="editForm">
                <input type="hidden" id="categoryId">

                <div class="mb-3">
                    <label class="form-label">分类名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="categoryName" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">收支类型</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="2" id="type2">
                            <label class="form-check-label" for="type2">支出</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="1" id="type1">
                            <label class="form-check-label" for="type1">收入</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">排序值</label>
                    <input type="number" class="form-control" id="sort">
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/category/index" class="btn btn-light me-md-2">取消</a>
                    <button type="button" class="btn btn-primary" onclick="submitEdit()">保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        const id = new URLSearchParams(window.location.search).get('id');
        if(id) {
            loadInfo(id);
        }
    });

    function loadInfo(id) {
        $.ajax({
            url: '/category/' + id,
            type: 'GET',
            success: function(res) {
                if(res.code === 200) {
                    var data = res.data;
                    $('#categoryId').val(data.id);
                    $('#categoryName').val(data.categoryName);
                    $('#sort').val(data.sort);
                    // 选中对应的单选框
                    if(data.type === 1) $('#type1').prop('checked', true);
                    else $('#type2').prop('checked', true);
                } else {
                    alert("加载失败");
                }
            }
        });
    }

    function submitEdit() {
        var data = {
            id: $('#categoryId').val(),
            categoryName: $('#categoryName').val(),
            type: $('input[name="type"]:checked').val(),
            sort: $('#sort').val()
        };

        $.ajax({
            url: '/category', // PUT
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    window.location.href = '/category/index';
                } else {
                    alert(res.msg); // 如果修改系统默认分类，会报错提示
                }
            }
        });
    }
</script>
</body>
</html>
