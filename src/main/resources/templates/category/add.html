<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加类别</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">添加新类别</h2>

    <div class="form-card">
        <form id="addCategoryForm" th:object="${categoryDTO}">
            <div class="form-group">
                <label>类别类型</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="typeIncome" name="type" th:field="*{type}" value="1" checked required>
                        <label class="form-check-label" for="typeIncome">收入</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="typeExpense" name="type" th:field="*{type}" value="2" required>
                        <label class="form-check-label" for="typeExpense">支出</label>
                    </div>
                </div>
            </div>
            <div class="form-group mt-3">
                <label for="categoryName">类别名称</label>
                <input type="text" class="form-control" id="categoryName" th:field="*{categoryName}" placeholder="如：餐饮、工资" required>
            </div>
            <div class="form-group">
                <label for="sort">排序 (数字越小越靠前)</label>
                <input type="number" class="form-control" id="sort" th:field="*{sort}" value="0">
            </div>
            <div class="form-group text-center mt-4">
                <button type="submit" class="btn btn-primary">添加类别</button>
                <a th:href="@{/category/list}" class="btn btn-secondary ml-3">取消</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        $('#addCategoryForm').submit(function(e) {
            e.preventDefault();
            let categoryData = {
                categoryName: $('#categoryName').val(),
                type: parseInt($('input[name="type"]:checked').val()),
                sort: parseInt($('#sort').val())
            };

            sendAjaxRequest('/category/api/add', 'POST', categoryData, function() {
                showMessage('类别添加成功！', 'success');
                window.location.href = '/category/list'; // 添加成功后跳转回列表
            });
        });
    });
</script>
</body>
</html>
