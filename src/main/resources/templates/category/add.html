<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增分类</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0">新增分类</h5>
        </div>
        <div class="card-body">
            <form id="addForm">
                <div class="mb-3">
                    <label class="form-label">分类名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="categoryName" placeholder="例如：兼职、宠物" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">收支类型</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="2" checked>
                            <label class="form-check-label">支出</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="type" value="1">
                            <label class="form-check-label">收入</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">排序值</label>
                    <input type="number" class="form-control" name="sort" value="100">
                    <div class="form-text">数字越小显示越靠前</div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/category/index" class="btn btn-light me-md-2">取消</a>
                    <button type="button" class="btn btn-primary" onclick="submitAdd()">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    function submitAdd() {
        var data = {
            categoryName: $('input[name="categoryName"]').val(),
            type: $('input[name="type"]:checked').val(),
            sort: $('input[name="sort"]').val()
        };

        if(!data.categoryName) {
            alert("请填写分类名称");
            return;
        }

        $.ajax({
            url: '/category', // POST
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    window.location.href = '/category/index';
                } else {
                    alert("操作失败：" + res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
