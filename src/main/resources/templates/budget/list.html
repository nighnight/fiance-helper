<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预算设置</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">预算设置</h2>

    <!-- 预算筛选和操作区域 -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">筛选预算</h5>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="cycleType">预算周期</label>
                    <select class="form-control" id="cycleType">
                        <option value="1" selected>月度</option>
                        <!-- <option value="2">季度</option> -->
                        <!-- <option value="3">年度</option> -->
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label for="cycleValue">周期值</label>
                    <input type="month" class="form-control" id="cycleValue" th:value="${currentMonth}">
                </div>
                <div class="form-group col-md-4 align-self-end">
                    <button type="button" class="btn btn-info mr-2" id="filterBudgetsButton">查询</button>
                    <a th:href="@{/budget/add}" class="btn btn-primary">新增预算</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 预算列表 -->
    <div class="data-table">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>预算类别</th>
                <th>预算周期</th>
                <th>预算金额</th>
                <th>已使用金额</th>
                <th>剩余金额</th>
                <th>使用进度</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="budgetTableBody">
            <tr><td colspan="7" class="text-center">请选择周期查询预算</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    $(function() {
        // 默认加载当前月的预算
        loadBudgets();

        // 绑定筛选按钮事件
        $('#filterBudgetsButton').click(function() {
            loadBudgets();
        });

        function loadBudgets() {
            let cycleType = $('#cycleType').val(); // 1: 月度
            let cycleValue = $('#cycleValue').val(); // yyyy-MM

            if (!cycleValue) {
                showMessage('请选择周期值', 'warning');
                return;
            }

            sendAjaxRequest('/budget/api/current', 'GET', { cycleType: cycleType, cycleValue: cycleValue }, function(budgets) {
                renderBudgetsTable(budgets);
            });
        }

        function renderBudgetsTable(budgets) {
            let tbody = $('#budgetTableBody');
            tbody.empty();
            if (budgets && budgets.length > 0) {
                budgets.forEach(function(budget) {
                    let progressClass = '';
                    if (budget.progress > 100) {
                        progressClass = 'bg-danger'; // 超出预算
                    } else if (budget.progress > 80) {
                        progressClass = 'bg-warning'; // 接近预算
                    } else {
                        progressClass = 'bg-primary';
                    }
                    let row = `
                            <tr data-id="${budget.id}">
                                <td>${budget.categoryName}</td>
                                <td>${budget.cycleTypeName} (${budget.cycleValue})</td>
                                <td>¥ ${budget.budgetAmount.toFixed(2)}</td>
                                <td>¥ ${budget.usedAmount.toFixed(2)}</td>
                                <td>¥ ${budget.remainingAmount.toFixed(2)}</td>
                                <td>
                                    <div class="progress">
                                        <div class="progress-bar ${progressClass}" role="progressbar" style="width: ${Math.min(budget.progress, 100).toFixed(2)}%;" aria-valuenow="${budget.progress.toFixed(2)}" aria-valuemin="0" aria-valuemax="100">
                                            ${budget.progress.toFixed(2)}%
                                        </div>
                                    </div>
                                </td>
                                <td class="action-buttons">
                                    <a href="/budget/edit/${budget.id}" class="btn btn-sm btn-warning">编辑</a>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${budget.id}">删除</button>
                                </td>
                            </tr>
                        `;
                    tbody.append(row);
                });
            } else {
                tbody.append('<tr><td colspan="7" class="text-center">当前周期暂无预算</td></tr>');
            }
        }

        // 绑定删除按钮事件
        $('#budgetTableBody').on('click', '.delete-btn', function() {
            let budgetId = $(this).data('id');
            confirmAction('确定要删除这条预算吗？', function() {
                sendAjaxRequest('/budget/api/delete/' + budgetId, 'DELETE', null, function() {
                    showMessage('预算删除成功！', 'success');
                    loadBudgets(); // 重新加载列表
                });
            });
        });
    });
</script>
</body>
</html>
