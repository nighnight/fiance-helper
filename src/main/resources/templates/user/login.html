<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 财务助手</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            /* 1. 设置背景图 */
            background-image: url('/img/login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            /* 2. 使用 Flexbox 实现完美居中 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            overflow: hidden;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .welcome-panel {
            background-color: rgba(106, 90, 205, 0.7);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .welcome-panel .logo {
            width: 80px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        .form-panel {
            background-color: rgba(255, 255, 255, 0.5);
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-panel h3 { font-weight: 700; color: #333; }
        .form-control, .form-control:focus { background-color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0,0,0,0.1); }
        .btn-primary { background-color: #6A5ACD; border: none; border-radius: 8px; padding: 12px; font-weight: 600; }
        .btn-primary:hover { background-color: #594ab2; }
    </style>
    <link rel="icon" type="image/x-icon" th:href="@{/ficon.png}">
</head>

<body>

<!-- ▼▼▼ 关键修改：移除了外层的 <div class="container"> ▼▼▼ -->
<div class="login-container">
    <!-- 左侧欢迎面板 -->
    <div class="col-md-5 welcome-panel d-none d-md-flex">
        <div>
            <img th:src="@{/img/logo.jpeg}" alt="Logo" class="logo">
            <h2 class="fw-bold">财务助手</h2>
            <p class="mt-2 opacity-75">FINANCE HELPER</p>
        </div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="col-12 col-md-7 form-panel">
        <h3>Welcome Back,</h3>
        <p class="text-muted mb-4">Sign in to continue</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control form-control-lg" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" class="form-control form-control-lg" name="password" placeholder="请输入密码" required>
            </div>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" onclick="submitLogin()">Login</button>
            </div>
            <div class="mt-4 text-center">
                <span class="text-muted">New user?</span>
                <a href="/user/register" class="text-decoration-none fw-bold" style="color: #6A5ACD;">Signup</a>
            </div>
        </form>
    </div>
</div>
<!-- ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ -->

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    // JS 代码不需要修改
    $(document).keyup(function(event){ if(event.keyCode === 13){ submitLogin(); } });
    function submitLogin() {
        var username = $("input[name='username']").val().trim();
        var password = $("input[name='password']").val().trim();
        if(!username || !password) { alert("请输入用户名和密码"); return; }
        var data = { username: username, password: password };
        $.ajax({
            url: '/user/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) { window.location.href = '/'; }
                else { alert(res.msg); }
            },
            error: function() { alert("登录失败，请检查网络或联系管理员"); }
        });
    }
</script>
</body>
</html>
