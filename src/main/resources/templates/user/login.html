<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 财务助手</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background: white;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h3 {
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h3>💰 财务助手</h3>
        <p class="text-muted">请登录您的账户</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" class="form-control form-control-lg" name="username" placeholder="请输入用户名" required>
        </div>

        <div class="mb-4">
            <label class="form-label">密码</label>
            <input type="password" class="form-control form-control-lg" name="password" placeholder="请输入密码" required>
        </div>

        <div class="d-grid gap-2">
            <button type="button" class="btn btn-primary btn-lg" onclick="submitLogin()">立即登录</button>
        </div>

        <div class="mt-4 text-center">
            <span class="text-muted">还没有账号？</span>
            <a href="/user/register" class="text-decoration-none fw-bold">去注册</a>
        </div>
    </form>
</div>

<!-- 引入 jQuery -->
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    // 监听回车键
    $(document).keyup(function(event) {
        if (event.keyCode === 13) {
            submitLogin();
        }
    });

    function submitLogin() {
        // 1. 获取表单数据
        var username = $("input[name='username']").val().trim();
        var password = $("input[name='password']").val().trim();

        // 2. 简单校验
        if(!username) {
            alert("请输入用户名");
            return;
        }
        if(!password) {
            alert("请输入密码");
            return;
        }

        var data = {
            username: username,
            password: password
        };

        // 3. 发送 AJAX 请求
        $.ajax({
            url: '/user/login',  // 对应后端 @PostMapping("/login")
            type: 'POST',        // 必须是 POST
            contentType: 'application/json', // 必须声明 JSON 类型
            data: JSON.stringify(data),      // 将对象转为 JSON 字符串
            success: function(res) {
                if(res.code === 200) {
                    // 登录成功，跳转到首页
                    window.location.href = '/';
                } else {
                    // 登录失败，显示后端返回的错误信息
                    alert(res.msg);
                }
            },
            error: function(xhr, status, error) {
                console.error("Login Error:", xhr.responseText);
                alert("系统错误，请检查控制台日志");
            }
        });
    }
</script>
</body>
</html>
