<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>修改密码</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">财务助手</a>
    <span class="navbar-text text-white">安全设置</span>
  </div>
</nav>

<div class="container" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0">修改密码</h5>
    </div>
    <div class="card-body p-4">
      <form id="pwdForm">
        <div class="mb-3">
          <label class="form-label">原密码</label>
          <input type="password" class="form-control" name="oldPwd" required>
        </div>
        <div class="mb-3">
          <label class="form-label">新密码</label>
          <input type="password" class="form-control" name="newPwd" required>
        </div>
        <div class="mb-4">
          <label class="form-label">确认新密码</label>
          <input type="password" class="form-control" name="confirmPwd" required>
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-danger" onclick="submitChange()">确认修改</button>
          <a href="/user/profile" class="btn btn-link text-muted">返回个人中心</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
  function submitChange() {
    var oldPwd = $('input[name="oldPwd"]').val();
    var newPwd = $('input[name="newPwd"]').val();
    var confirmPwd = $('input[name="confirmPwd"]').val();

    if(!oldPwd || !newPwd) {
      alert("请填写密码");
      return;
    }
    if(newPwd !== confirmPwd) {
      alert("两次新密码输入不一致");
      return;
    }

    $.ajax({
      url: '/user/updatePassword',
      type: 'PUT',
      data: { oldPwd: oldPwd, newPwd: newPwd },
      success: function(res) {
        if(res.code === 200) {
          alert("密码修改成功，请重新登录");
          window.location.href = '/user/login';
        } else {
          alert(res.msg);
        }
      }
    });
  }
</script>
</body>
</html>
