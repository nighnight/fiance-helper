<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 财务助手</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .register-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background: white;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center mb-4">创建新账户</h3>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">用户名 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="username" placeholder="用于登录的账号" required>
        </div>

        <div class="mb-3">
            <label class="form-label">昵称 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="nickname" placeholder="例如：张三" required>
        </div>

        <div class="mb-4">
            <label class="form-label">密码 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" name="password" placeholder="设置登录密码" required>
        </div>

        <div class="d-grid gap-2">
            <button type="button" class="btn btn-success btn-lg" onclick="submitRegister()">注册并登录</button>
        </div>

        <div class="mt-4 text-center">
            <span class="text-muted">已有账号？</span>
            <a href="/user/login" class="text-decoration-none fw-bold">直接登录</a>
        </div>
    </form>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    function submitRegister() {
        var data = {
            username: $("input[name='username']").val().trim(),
            nickname: $("input[name='nickname']").val().trim(),
            password: $("input[name='password']").val().trim()
        };

        if(!data.username || !data.password || !data.nickname) {
            alert("请填写完整的注册信息");
            return;
        }

        $.ajax({
            url: '/user/register', // 对应后端 @PostMapping("/register")
            type: 'POST',          // 必须是 POST
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    alert("注册成功！即将跳转登录页面...");
                    // 注册成功后，跳转回登录页
                    window.location.href = '/user/login';
                } else {
                    alert("注册失败：" + res.msg);
                }
            },
            error: function(xhr) {
                alert("请求出错：" + xhr.status);
            }
        });
    }
</script>
</body>
</html>
