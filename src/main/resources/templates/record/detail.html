<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'记录详情 - ' + record.categoryName}">记录详情</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">收支记录详情与编辑</h2>

    <div class="form-card">
        <form id="recordDetailForm">
            <input type="hidden" id="detailId" th:value="${record.id}">
            <div class="form-group">
                <label>类型</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="detailTypeIncome" name="detailType" value="1" th:checked="${record.type == 1}">
                        <label class="form-check-label" for="detailTypeIncome">收入</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="detailTypeExpense" name="detailType" value="2" th:checked="${record.type == 2}">
                        <label class="form-check-label" for="detailTypeExpense">支出</label>
                    </div>
                </div>
            </div>

            <div class="form-group mt-3">
                <label for="detailAmount">金额</label>
                <input type="number" step="0.01" class="form-control" id="detailAmount" th:value="${record.amount}" required>
            </div>

            <div class="form-group" id="detailIncomeCategoryGroup" th:style="${record.type == 1 ? '' : 'display: none;'}">
                <label for="detailIncomeCategoryId">收入类别</label>
                <select class="form-control" id="detailIncomeCategoryId" required>
                    <!-- 由JS动态加载 -->
                </select>
            </div>

            <div class="form-group" id="detailExpenseCategoryGroup" th:style="${record.type == 2 ? '' : 'display: none;'}">
                <label for="detailExpenseCategoryId">支出类别</label>
                <select class="form-control" id="detailExpenseCategoryId" required>
                    <!-- 由JS动态加载 -->
                </select>
            </div>

            <div class="form-group">
                <label for="detailAccountId">账户</label>
                <select class="form-control" id="detailAccountId" required>
                    <!-- 由JS动态加载 -->
                </select>
            </div>

            <div class="form-group">
                <label for="detailRecordDate">日期</label>
                <input type="date" class="form-control" id="detailRecordDate" th:value="${record.recordDate}" required>
            </div>

            <div class="form-group">
                <label for="detailRemark">备注 (可选)</label>
                <textarea class="form-control" id="detailRemark" rows="3" th:text="${record.remark}"></textarea>
            </div>

            <div class="form-group">
                <label>凭证图片 (可选)</label>
                <div class="input-group">
                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="voucherFile" accept="image/*">
                        <label class="custom-file-label" for="voucherFile" id="voucherFileName">选择文件</label>
                    </div>
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary" type="button" id="voucherUploadBtn">上传</button>
                    </div>
                </div>
                <!-- 显示已有的凭证图片 -->
                <img id="voucherImage" th:src="${record.voucherUrl != null and #strings.length(record.voucherUrl) > 0 ? record.voucherUrl : ''}"
                     alt="凭证图片"
                     style="max-width: 100%; max-height: 200px; margin-top: 10px;"
                     th:styleappend="${record.voucherUrl != null and #strings.length(record.voucherUrl) > 0 ? '' : 'display: none;'}">
            </div>

            <div class="form-group text-center mt-4">
                <button type="button" class="btn btn-primary" id="updateRecordButton">保存修改</button>
                <a th:href="@{/record/list}" class="btn btn-secondary ml-3">返回列表</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script th:src="@{/static/js/record.js}"></script>
<script>
    $(function() {
        // 更新文件选择框的文件名显示
        $('#voucherFile').on('change', function() {
            let fileName = $(this).val().split('\\').pop();
            $('#voucherFileName').text(fileName || '选择文件');
        });

        // initial load is handled by record.js
    });
</script>
</body>
</html>
