<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收支记录</title>
    <link rel="stylesheet" th:href="@{/static/lib/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<div th:replace="common/header :: header"></div>

<div class="container mt-4">
    <h2 class="mb-4">收支记录</h2>

    <!-- 筛选条件 -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">筛选条件</h5>
            <div class="form-row">
                <div class="form-group col-md-3">
                    <label for="startDate">开始日期</label>
                    <input type="date" class="form-control" id="startDate" th:value="${startDate}">
                </div>
                <div class="form-group col-md-3">
                    <label for="endDate">结束日期</label>
                    <input type="date" class="form-control" id="endDate" th:value="${endDate}">
                </div>
                <div class="form-group col-md-2">
                    <label for="filterType">类型</label>
                    <select class="form-control" id="filterType">
                        <option value="">所有</option>
                        <option value="1">收入</option>
                        <option value="2">支出</option>
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <label for="filterCategoryId">类别</label>
                    <select class="form-control" id="filterCategoryId">
                        <option value="">所有类别</option>
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <label for="filterAccountId">账户</label>
                    <select class="form-control" id="filterAccountId">
                        <option value="">所有账户</option>
                    </select>
                </div>
            </div>
            <div class="form-group text-right">
                <button type="button" class="btn btn-primary" id="filterButton">筛选</button>
                <a th:href="@{/record/add}" class="btn btn-success ml-2">新增记录</a>
            </div>
        </div>
    </div>

    <!-- 记录列表 -->
    <div class="data-table">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>日期</th>
                <th>类型</th>
                <th>类别</th>
                <th>账户</th>
                <th>金额</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="recordTableBody">
            <tr><td colspan="7" class="text-center">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>

<script th:src="@{/static/lib/jquery.min.js}"></script>
<script th:src="@{/static/lib/bootstrap.min.js}"></script>
<script th:src="@{/static/js/common.js}"></script>
<script th:src="@{/static/js/record.js}"></script>
</body>
</html>
