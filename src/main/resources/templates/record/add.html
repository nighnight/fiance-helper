<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>记一笔</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto shadow" style="max-width: 500px;">
        <div class="card-header bg-white py-3 text-center">
            <h5 class="mb-0">记一笔</h5>
        </div>
        <div class="card-body p-4">
            <form id="addForm">
                <!-- 1. 类型选择 -->
                <div class="mb-4 text-center">
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="type" id="type2" value="2" checked onchange="filterCategories()">
                        <label class="btn btn-outline-danger" for="type2">支出</label>

                        <input type="radio" class="btn-check" name="type" id="type1" value="1" onchange="filterCategories()">
                        <label class="btn btn-outline-success" for="type1">收入</label>
                    </div>
                </div>

                <!-- 2. 金额 -->
                <div class="mb-3">
                    <label class="form-label">金额</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">¥</span>
                        <input type="number" class="form-control" name="amount" placeholder="0.00" step="0.01" required>
                    </div>
                </div>

                <!-- 3. 日期 -->
                <div class="mb-3">
                    <label class="form-label">日期</label>
                    <input type="date" class="form-control" name="recordDate" required>
                </div>

                <!-- 4. 分类 (动态加载) -->
                <div class="mb-3">
                    <label class="form-label">分类</label>
                    <select class="form-select" name="categoryId" id="categorySelect">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <!-- 5. 账户 (动态加载) -->
                <div class="mb-3">
                    <label class="form-label">账户</label>
                    <select class="form-select" name="accountId" id="accountSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <!-- 6. 备注 -->
                <div class="mb-4">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" name="remark" rows="2"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-primary btn-lg" onclick="submitAdd()">保存</button>
                    <a href="/record/index" class="btn btn-link text-muted">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    // 缓存所有分类数据
    let allCategories = [];

    $(document).ready(function() {
        // 设置默认日期为今天
        document.querySelector('input[name="recordDate"]').valueAsDate = new Date();

        // 并行加载下拉框数据
        loadAccounts();
        loadCategories();
    });

    function loadAccounts() {
        $.ajax({
            url: '/account/list',
            type: 'GET',
            success: function(res) {
                let html = '';
                if(res.data && res.data.length > 0) {
                    res.data.forEach(acc => {
                        html += `<option value="${acc.id}">${acc.accountName} (余额:${acc.currentBalance})</option>`;
                    });
                } else {
                    html = '<option value="">请先添加账户</option>';
                }
                $('#accountSelect').html(html);
            }
        });
    }

    function loadCategories() {
        $.ajax({
            url: '/category/list',
            type: 'GET',
            success: function(res) {
                allCategories = res.data || [];
                filterCategories(); // 数据加载完后立即过滤一次
            }
        });
    }

    // 根据选中的收/支类型，筛选分类下拉框
    function filterCategories() {
        let currentType = parseInt($('input[name="type"]:checked').val());
        let html = '';

        let filtered = allCategories.filter(c => c.type === currentType);

        if(filtered.length > 0) {
            filtered.forEach(c => {
                html += `<option value="${c.id}">${c.categoryName}</option>`;
            });
        } else {
            html = '<option value="">无分类，请去添加</option>';
        }
        $('#categorySelect').html(html);
    }

    function submitAdd() {
        let data = {
            type: $('input[name="type"]:checked').val(),
            amount: $('input[name="amount"]').val(),
            recordDate: $('input[name="recordDate"]').val(),
            categoryId: $('select[name="categoryId"]').val(),
            accountId: $('select[name="accountId"]').val(),
            remark: $('textarea[name="remark"]').val()
        };

        if(!data.amount || !data.categoryId || !data.accountId) {
            alert("请完整填写金额、分类和账户");
            return;
        }

        $.ajax({
            url: '/record', // POST
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(res) {
                if(res.code === 200) {
                    alert("记账成功！");
                    window.location.href = '/record/index';
                } else {
                    alert(res.msg);
                }
            }
        });
    }
</script>
</body>
</html>
