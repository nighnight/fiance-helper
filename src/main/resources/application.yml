spring:
  application:
    name: finance-helper
  profiles:
    active: dev # 激活开发环境配置
  thymeleaf:
    cache: false # 开发时禁用缓存，方便调试
    encoding: UTF-8
    mode: HTML # 官方推荐HTML5
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finance_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root # 您的MySQL用户名
    password: "@2370547251" # 您的MySQL密码
  # Spring Boot 3.x 移除了旧版的multipart配置，现在默认使用ServletBasedMultipart
  servlet:
    multipart:
      max-file-size: 5MB # 单个文件最大5MB
      max-request-size: 10MB # 单次请求文件总大小最大10MB

mybatis:
  mapper-locations: classpath:mybatis/*.xml # Mapper XML文件位置
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射

server:
  port: 8080 # 应用端口
  servlet:
    session:
      timeout: 30m # Session 超时时间 30 分钟

file:
  upload-dir: D:/finance_helper_uploads/ # 根据您的操作系统修改，例如 /var/finance_helper_uploads/
  # 注意：Windows路径使用 / 或 \\，Linux使用 /
# ... 原有配置 ...

aliyun:
  oss:
    endpoint: ${finance.aliyun.oss.endpoint}  # 你的Bucket所在地域节点
    access-key-id: ${finance.aliyun.oss.access-key-id}     # 你的AccessKey ID
    access-key-secret: ${finance.aliyun.oss.access-key-secret} # 你的AccessKey Secret
    bucket-name: ${finance.aliyun.oss.bucket-name}         # 你的Bucket名称


# ... 原有配置 ...

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql         # 指定数据库方言
  reasonable-page-num: true     # 开启分页合理化，如果页码<1则查第一页，>总页数则查最后一页
  support-methods-arguments: true # 支持通过Mapper接口方法参数传递分页参数
  params: pageNum=pageNum;pageSize=pageSize; # 参数映射

logging:
  level:
    # 将你的 Mapper 接口所在的包路径设置为 DEBUG 级别
    com.finance.mapper: DEBUG